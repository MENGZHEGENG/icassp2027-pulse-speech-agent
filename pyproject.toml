[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-speech-agent"
version = "0.1.0"
description = "Phonetic uncertainty-aware self-reflection for streaming tool-using voice agents."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "tqdm>=4.66",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
phonetic = [
  "pronouncing>=0.2",
]
asr = [
  "torch",
  "transformers>=4.40",
  "datasets>=2.18",
  "soundfile>=0.12",
  "librosa>=0.10",
  "jiwer>=3.0",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
